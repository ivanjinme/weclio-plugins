name: Publish Weclio plugins

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest

      - name: Verify aggregate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./bundle/package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Pack complete distribution
        run: npm run pack

      - name: Verify extracted package with Pi
        run: |
          version="$(node -p "require('./bundle/package.json').version")"
          npm run verify:package -- "dist/weclio-plugins-$version.tgz"

      - name: Publish aggregate package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./bundle/package.json').version")"
          npm publish "./dist/weclio-plugins-$version.tgz" --access public --provenance
