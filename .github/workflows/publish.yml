name: Publish Pi extension

on:
  push:
    tags:
      - "extensions/**/v*"
  workflow_dispatch:
    inputs:
      package_dir:
        description: "Workspace package directory, e.g. extensions/pi-web-search"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest

      - name: Resolve and verify package
        env:
          TAG_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE_DIR: ${{ inputs.package_dir }}
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "$TAG_NAME" in
              extensions/*/v*)
                package_dir="${TAG_NAME%/v*}"
                tag_version="${TAG_NAME##*/v}"
                ;;
              *)
                echo "Tag must have the form extensions/<package>/v<version>." >&2
                exit 1
                ;;
            esac
          else
            package_dir="$INPUT_PACKAGE_DIR"
            tag_version=""
          fi

          node - "$package_dir" "$tag_version" <<'NODE'
          const [packageDir, tagVersion] = process.argv.slice(2);
          if (!packageDir.startsWith("extensions/") || packageDir.includes("..")) {
            throw new Error("package_dir must be a direct path below extensions/");
          }
          const pkg = require(`./${packageDir}/package.json`);
          if (pkg.private) throw new Error(`${packageDir} is private and cannot be published`);
          if (!pkg.name || !pkg.version) throw new Error(`${packageDir}/package.json needs name and version`);
          if (tagVersion && pkg.version !== tagVersion) {
            throw new Error(`tag version ${tagVersion} does not match ${pkg.name}@${pkg.version}`);
          }
          console.log(`Publishing ${pkg.name}@${pkg.version} from ${packageDir}`);
          NODE

          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Preview package contents
        run: cd "$PACKAGE_DIR" && npm pack --dry-run

      - name: Publish to npm
        run: cd "$PACKAGE_DIR" && npm publish --provenance
